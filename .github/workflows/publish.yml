name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Show tool versions
        run: node --version && npm --version

      # Authenticates through OIDC. Requires a trusted publisher on npmjs.com
      # pointing at this repository and this workflow file, so no token is
      # stored anywhere. The very first release has to be published by hand,
      # because npm will not let you configure a trusted publisher for a
      # package that does not exist yet.
      #
      # Provenance is generated automatically for public repositories, so
      # --provenance is not needed here.
      - run: npm publish
